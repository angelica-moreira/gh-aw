name: Prove-it gate

# Scans the lines a pull request adds, builds a small site with the PR's own docs Head
# component to see whether attack strings run as script, and compares the docs node tests
# before and after the change. Reproduce any run locally with the command in its summary.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Base commit or ref
        required: true
      head:
        description: Head commit or ref
        required: true

permissions:
  contents: read

concurrency:
  group: prove-it-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GATE_BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
      GATE_HEAD: ${{ github.event.pull_request.head.sha || inputs.head }}
    steps:
      # The gate code comes from the base branch, so a pull request cannot change the rules it is judged by.
      - name: Checkout gate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: gate
          sparse-checkout: scripts/prove-it
          persist-credentials: false

      - name: Checkout change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.head }}
          path: repo
          fetch-depth: 0
          persist-credentials: false

      - name: Check the base has the gate
        id: present
        run: |
          if [ -f gate/scripts/prove-it/gate.mjs ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The base revision has no scripts/prove-it, so there is nothing to run."
          fi

      - name: Setup Node.js
        if: steps.present.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'repo/docs/package-lock.json'

      - name: Install docs dependencies
        if: steps.present.outputs.run == 'true'
        working-directory: repo/docs
        run: npm ci --legacy-peer-deps

      - name: Install Chromium
        if: steps.present.outputs.run == 'true'
        working-directory: repo/docs
        run: npx playwright install --with-deps chromium

      - name: Run gate
        if: steps.present.outputs.run == 'true'
        run: node gate/scripts/prove-it/gate.mjs run --repo repo --base "$GATE_BASE" --head "$GATE_HEAD" --out "$RUNNER_TEMP/prove-it"

      - name: Write summary
        if: always() && steps.present.outputs.run == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/prove-it/summary.md" ]; then
            cat "$RUNNER_TEMP/prove-it/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence
        if: always() && steps.present.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prove-it-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/prove-it/run.json
            ${{ runner.temp }}/prove-it/summary.md
          if-no-files-found: warn
